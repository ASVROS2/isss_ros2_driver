[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isss-core"
version = "0.2.0"
description = "Python interface for the DeepVision Interferometric Side Scan Sonar (ISSS)"
readme = "README.md"
license = {text = "MIT"}  # table form: older setuptools (colcon builds) rejects the string form
requires-python = ">=3.9"  # setup.py keeps it readable for colcon (see _Distribution there)
authors = [{ name = "KTH SMaRC" }, { name = "Julian Valdez", email = "jvaldez@kth.se" }]
keywords = ["sonar", "sidescan", "deepvision", "isss", "interferometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "numpy>=1.20"]
export = [
    "h5netcdf>=1.1",
    "h5py>=3.0",
    "numpy>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "h5netcdf>=1.1",
    "xarray>=2024.7.0",
    "h5py>=3.0",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
isss-bench = "isss.bench:main"
isss-export = "isss.cli:main_export"
isss-export-legacy = "isss.cli:main_export_legacy"
isss-report = "isss.cli:main_report"
isss-stream = "isss.cli:main_stream"
isss-sim = "isss.sim:main"
isss-view = "isss.cli:main_view"
isss-view-legacy = "isss.cli:main_view_legacy"

[tool.hatch.build.targets.wheel]
packages = ["src/isss"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/tests/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS's launch_testing plugin (colcon test) turns one module-level skip into skipping every test
addopts = "-p no:launch_testing -p no:launch_ros"
