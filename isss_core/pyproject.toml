[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isss-core"
version = "0.2.0"
description = "Python interface for the DeepVision Interferometric Side Scan Sonar (ISSS)"
readme = "README.md"
license = {text = "MIT"}  # table form: older setuptools (colcon builds) rejects the string form
requires-python = ">=3.9"
authors = [{ name = "KTH SMaRC" }, { name = "Julian Valdez", email = "jvaldez@kth.se" }]
keywords = ["sonar", "sidescan", "deepvision", "isss", "interferometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "numpy>=1.20"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "numpy>=1.20",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
isss-report = "isss.cli:main_report"
isss-stream = "isss.cli:main_stream"
isss-sim = "isss.sim:main"
isss-view = "isss.cli:main_view"

[tool.hatch.build.targets.wheel]
packages = ["src/isss"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/tests/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
